<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      /* Matrix rain columns */
      .rain { font-family: 'Share Tech Mono', 'Courier New', monospace; fill: #00FF41; font-size: 14px; opacity: 0; }
      .rain-dim { font-family: 'Share Tech Mono', 'Courier New', monospace; fill: #003B00; font-size: 14px; opacity: 0.4; }

      .r1  { animation: fall1  4.0s linear 0.0s infinite; }
      .r2  { animation: fall2  3.5s linear 0.3s infinite; }
      .r3  { animation: fall3  5.0s linear 0.8s infinite; }
      .r4  { animation: fall4  3.8s linear 1.2s infinite; }
      .r5  { animation: fall5  4.5s linear 0.5s infinite; }
      .r6  { animation: fall6  3.2s linear 1.8s infinite; }
      .r7  { animation: fall7  4.8s linear 0.2s infinite; }
      .r8  { animation: fall8  3.6s linear 1.0s infinite; }
      .r9  { animation: fall9  5.2s linear 0.7s infinite; }
      .r10 { animation: fall10 3.9s linear 1.5s infinite; }
      .r11 { animation: fall11 4.3s linear 0.4s infinite; }
      .r12 { animation: fall12 3.4s linear 2.0s infinite; }
      .r13 { animation: fall13 4.7s linear 0.1s infinite; }
      .r14 { animation: fall14 3.3s linear 1.6s infinite; }
      .r15 { animation: fall15 5.1s linear 0.9s infinite; }
      .r16 { animation: fall16 3.7s linear 1.3s infinite; }
      .r17 { animation: fall17 4.2s linear 2.2s infinite; }
      .r18 { animation: fall18 3.1s linear 0.6s infinite; }

      @keyframes fall1  { 0%{opacity:0;transform:translateY(-320px)} 10%{opacity:0.8} 90%{opacity:0.3} 100%{opacity:0;transform:translateY(320px)} }
      @keyframes fall2  { 0%{opacity:0;transform:translateY(-280px)} 10%{opacity:0.9} 85%{opacity:0.2} 100%{opacity:0;transform:translateY(350px)} }
      @keyframes fall3  { 0%{opacity:0;transform:translateY(-350px)} 15%{opacity:0.7} 90%{opacity:0.25} 100%{opacity:0;transform:translateY(300px)} }
      @keyframes fall4  { 0%{opacity:0;transform:translateY(-300px)} 10%{opacity:0.85} 88%{opacity:0.3} 100%{opacity:0;transform:translateY(340px)} }
      @keyframes fall5  { 0%{opacity:0;transform:translateY(-340px)} 12%{opacity:0.75} 92%{opacity:0.2} 100%{opacity:0;transform:translateY(310px)} }
      @keyframes fall6  { 0%{opacity:0;transform:translateY(-260px)} 8%{opacity:0.9} 85%{opacity:0.35} 100%{opacity:0;transform:translateY(360px)} }
      @keyframes fall7  { 0%{opacity:0;transform:translateY(-370px)} 14%{opacity:0.65} 90%{opacity:0.2} 100%{opacity:0;transform:translateY(290px)} }
      @keyframes fall8  { 0%{opacity:0;transform:translateY(-290px)} 10%{opacity:0.8} 87%{opacity:0.3} 100%{opacity:0;transform:translateY(330px)} }
      @keyframes fall9  { 0%{opacity:0;transform:translateY(-360px)} 16%{opacity:0.6} 93%{opacity:0.15} 100%{opacity:0;transform:translateY(280px)} }
      @keyframes fall10 { 0%{opacity:0;transform:translateY(-310px)} 11%{opacity:0.85} 89%{opacity:0.25} 100%{opacity:0;transform:translateY(320px)} }
      @keyframes fall11 { 0%{opacity:0;transform:translateY(-330px)} 13%{opacity:0.7} 91%{opacity:0.2} 100%{opacity:0;transform:translateY(310px)} }
      @keyframes fall12 { 0%{opacity:0;transform:translateY(-250px)} 7%{opacity:0.95} 84%{opacity:0.3} 100%{opacity:0;transform:translateY(370px)} }
      @keyframes fall13 { 0%{opacity:0;transform:translateY(-380px)} 15%{opacity:0.6} 92%{opacity:0.2} 100%{opacity:0;transform:translateY(280px)} }
      @keyframes fall14 { 0%{opacity:0;transform:translateY(-270px)} 9%{opacity:0.9} 86%{opacity:0.3} 100%{opacity:0;transform:translateY(350px)} }
      @keyframes fall15 { 0%{opacity:0;transform:translateY(-355px)} 16%{opacity:0.65} 93%{opacity:0.15} 100%{opacity:0;transform:translateY(290px)} }
      @keyframes fall16 { 0%{opacity:0;transform:translateY(-295px)} 10%{opacity:0.8} 88%{opacity:0.28} 100%{opacity:0;transform:translateY(335px)} }
      @keyframes fall17 { 0%{opacity:0;transform:translateY(-335px)} 14%{opacity:0.7} 91%{opacity:0.2} 100%{opacity:0;transform:translateY(305px)} }
      @keyframes fall18 { 0%{opacity:0;transform:translateY(-245px)} 6%{opacity:0.95} 83%{opacity:0.35} 100%{opacity:0;transform:translateY(375px)} }

      /* Main name text */
      .name-text {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 48px;
        font-weight: bold;
        fill: #00FF41;
        filter: url(#glow);
        animation: textGlitch 8s ease-in-out infinite;
      }
      @keyframes textGlitch {
        0%, 92%, 94%, 96%, 98%, 100% { opacity: 1; transform: translate(0,0); }
        93% { opacity: 0.8; transform: translate(-2px, 1px); fill: #00CC33; }
        95% { opacity: 0.9; transform: translate(1px, -1px); fill: #33FF66; }
        97% { opacity: 0.7; transform: translate(-1px, 0px); fill: #00FF41; }
      }

      /* Subtitle */
      .subtitle {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 16px;
        fill: #00FF41;
        opacity: 0.7;
        animation: subtitlePulse 3s ease-in-out infinite;
      }
      @keyframes subtitlePulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.85; }
      }

      /* Cursor blink */
      .cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Scanline */
      .scanline {
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(-320px); }
        100% { transform: translateY(320px); }
      }

      /* Border pulse */
      .border-glow {
        animation: borderPulse 3s ease-in-out infinite;
      }
      @keyframes borderPulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }

      /* Bracket animation */
      .bracket {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 52px;
        fill: #00FF41;
        opacity: 0.6;
        animation: bracketPulse 2s ease-in-out infinite;
      }
      @keyframes bracketPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }

      /* Status line */
      .status {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #008F11;
        opacity: 0.6;
      }
    </style>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00FF41" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for rain -->
    <filter id="rainGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feFlood flood-color="#00FF41" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#0D0208" rx="12"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="50" y1="0" x2="50" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="250" y1="0" x2="250" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="350" y1="0" x2="350" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="550" y1="0" x2="550" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="650" y1="0" x2="650" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="850" y1="0" x2="850" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="320" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="900" y2="50" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="900" y2="100" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="900" y2="150" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="900" y2="250" stroke="#00FF41" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="#00FF41" stroke-width="0.5"/>
  </g>

  <!-- ═══ MATRIX RAIN COLUMNS ═══ -->

  <!-- Column 1 -->
  <text x="25" y="160" class="rain r1" filter="url(#rainGlow)">ア</text>
  <text x="25" y="180" class="rain r1" filter="url(#rainGlow)">0</text>
  <text x="25" y="200" class="rain r1" filter="url(#rainGlow)">ウ</text>
  <text x="25" y="220" class="rain-dim r1">1</text>
  <text x="25" y="240" class="rain-dim r1">カ</text>

  <!-- Column 2 -->
  <text x="55" y="140" class="rain r2" filter="url(#rainGlow)">7</text>
  <text x="55" y="160" class="rain r2" filter="url(#rainGlow)">タ</text>
  <text x="55" y="180" class="rain r2" filter="url(#rainGlow)">ネ</text>
  <text x="55" y="200" class="rain-dim r2">3</text>
  <text x="55" y="220" class="rain-dim r2">ミ</text>

  <!-- Column 3 -->
  <text x="85" y="150" class="rain r3" filter="url(#rainGlow)">ヒ</text>
  <text x="85" y="170" class="rain r3" filter="url(#rainGlow)">9</text>
  <text x="85" y="190" class="rain r3" filter="url(#rainGlow)">ソ</text>
  <text x="85" y="210" class="rain-dim r3">0</text>
  <text x="85" y="230" class="rain-dim r3">ラ</text>

  <!-- Column 4 -->
  <text x="115" y="145" class="rain r4" filter="url(#rainGlow)">2</text>
  <text x="115" y="165" class="rain r4" filter="url(#rainGlow)">ケ</text>
  <text x="115" y="185" class="rain r4" filter="url(#rainGlow)">ル</text>
  <text x="115" y="205" class="rain-dim r4">5</text>

  <!-- Column 5 - Left of name -->
  <text x="145" y="130" class="rain r5" filter="url(#rainGlow)">マ</text>
  <text x="145" y="150" class="rain r5" filter="url(#rainGlow)">4</text>
  <text x="145" y="170" class="rain-dim r5">テ</text>
  <text x="145" y="190" class="rain-dim r5">8</text>

  <!-- Column 6 -->
  <text x="175" y="120" class="rain r6" filter="url(#rainGlow)">1</text>
  <text x="175" y="140" class="rain r6" filter="url(#rainGlow)">ナ</text>
  <text x="175" y="240" class="rain-dim r6">6</text>
  <text x="175" y="260" class="rain-dim r6">ホ</text>

  <!-- Column 7 - above name area, sparse -->
  <text x="250" y="60" class="rain r7" filter="url(#rainGlow)">ハ</text>
  <text x="250" y="80" class="rain-dim r7">3</text>

  <!-- Column 8 -->
  <text x="350" y="50" class="rain r8" filter="url(#rainGlow)">ヨ</text>
  <text x="350" y="70" class="rain-dim r8">0</text>

  <!-- Column 9 -->
  <text x="450" y="55" class="rain r9" filter="url(#rainGlow)">ワ</text>
  <text x="450" y="75" class="rain-dim r9">1</text>

  <!-- Column 10 -->
  <text x="550" y="45" class="rain r10" filter="url(#rainGlow)">5</text>
  <text x="550" y="65" class="rain-dim r10">フ</text>

  <!-- Column 11 -->
  <text x="650" y="60" class="rain r11" filter="url(#rainGlow)">ト</text>
  <text x="650" y="80" class="rain-dim r11">2</text>

  <!-- Column 12 - Right side -->
  <text x="720" y="120" class="rain r12" filter="url(#rainGlow)">6</text>
  <text x="720" y="140" class="rain r12" filter="url(#rainGlow)">ニ</text>
  <text x="720" y="240" class="rain-dim r12">コ</text>
  <text x="720" y="260" class="rain-dim r12">9</text>

  <!-- Column 13 -->
  <text x="750" y="130" class="rain r13" filter="url(#rainGlow)">リ</text>
  <text x="750" y="150" class="rain r13" filter="url(#rainGlow)">4</text>
  <text x="750" y="170" class="rain-dim r13">セ</text>
  <text x="750" y="190" class="rain-dim r13">7</text>

  <!-- Column 14 -->
  <text x="785" y="145" class="rain r14" filter="url(#rainGlow)">ム</text>
  <text x="785" y="165" class="rain r14" filter="url(#rainGlow)">0</text>
  <text x="785" y="185" class="rain r14" filter="url(#rainGlow)">チ</text>
  <text x="785" y="205" class="rain-dim r14">3</text>

  <!-- Column 15 -->
  <text x="815" y="140" class="rain r15" filter="url(#rainGlow)">8</text>
  <text x="815" y="160" class="rain r15" filter="url(#rainGlow)">ヌ</text>
  <text x="815" y="180" class="rain r15" filter="url(#rainGlow)">ス</text>
  <text x="815" y="200" class="rain-dim r15">1</text>
  <text x="815" y="220" class="rain-dim r15">ロ</text>

  <!-- Column 16 -->
  <text x="843" y="150" class="rain r16" filter="url(#rainGlow)">ヤ</text>
  <text x="843" y="170" class="rain r16" filter="url(#rainGlow)">2</text>
  <text x="843" y="190" class="rain r16" filter="url(#rainGlow)">エ</text>
  <text x="843" y="210" class="rain-dim r16">5</text>
  <text x="843" y="230" class="rain-dim r16">シ</text>

  <!-- Column 17 -->
  <text x="870" y="155" class="rain r17" filter="url(#rainGlow)">ツ</text>
  <text x="870" y="175" class="rain r17" filter="url(#rainGlow)">7</text>
  <text x="870" y="195" class="rain r17" filter="url(#rainGlow)">キ</text>
  <text x="870" y="215" class="rain-dim r17">0</text>

  <!-- Column 18 - below name -->
  <text x="300" y="230" class="rain r18" filter="url(#rainGlow)">イ</text>
  <text x="300" y="250" class="rain-dim r18">4</text>
  <text x="400" y="240" class="rain r14" filter="url(#rainGlow)">ク</text>
  <text x="400" y="260" class="rain-dim r14">8</text>
  <text x="500" y="235" class="rain r16" filter="url(#rainGlow)">オ</text>
  <text x="500" y="255" class="rain-dim r16">6</text>
  <text x="600" y="245" class="rain r11" filter="url(#rainGlow)">レ</text>
  <text x="600" y="265" class="rain-dim r11">3</text>

  <!-- Scanline effect -->
  <rect class="scanline" x="0" y="0" width="900" height="4" fill="#00FF41" opacity="0.03"/>

  <!-- ═══ MAIN CONTENT ═══ -->

  <!-- Top status bar -->
  <text x="20" y="25" class="status">[SYSTEM] connection established...</text>
  <text x="680" y="25" class="status">SESSION: 0x4F2A · UPTIME: ∞</text>

  <!-- Decorative brackets -->
  <text x="195" y="165" class="bracket">{</text>
  <text x="695" y="165" class="bracket">}</text>

  <!-- Main name -->
  <text x="450" y="140" class="name-text" text-anchor="middle">SANCHIT</text>
  <text x="450" y="190" class="name-text" text-anchor="middle" font-size="42" opacity="0.9">SHARMA</text>

  <!-- Blinking cursor -->
  <rect x="565" y="173" width="12" height="3" fill="#00FF41" class="cursor"/>

  <!-- Subtitle -->
  <text x="450" y="230" class="subtitle" text-anchor="middle">// Backend Engineer · System Architect · AI Builder</text>

  <!-- Bottom decorative line -->
  <line x1="200" y1="250" x2="700" y2="250" stroke="#00FF41" stroke-width="0.5" opacity="0.3"/>

  <!-- Bottom status -->
  <text x="450" y="275" class="status" text-anchor="middle" opacity="0.4">「 wake up, Neo... the Matrix has you 」</text>

  <!-- Corner decorations -->
  <path d="M 15 15 L 15 45 M 15 15 L 45 15" stroke="#00FF41" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 885 15 L 885 45 M 885 15 L 855 15" stroke="#00FF41" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 15 305 L 15 275 M 15 305 L 45 305" stroke="#00FF41" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 885 305 L 885 275 M 885 305 L 855 305" stroke="#00FF41" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Border -->
  <rect x="2" y="2" width="896" height="316" rx="12" fill="none" stroke="#00FF41" stroke-width="1" class="border-glow"/>

  <!-- Bottom bar -->
  <text x="20" y="305" class="status" opacity="0.35">▸ github.com/BUNNY2205-blip</text>
  <text x="780" y="305" class="status" opacity="0.35">v2.0.25</text>

</svg>
